services:
  web:
    image: nginx:latest
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./server/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
      - 8080:8080
    networks:
      - app-network
    depends_on:
      - php
      - php_test
      
  php:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      - app-network
    depends_on:
      db:
        condition: service_started
      uploads-permissions:
        condition: service_completed_successfully

  uploads-permissions:
    image: alpine:3.20
    volumes:
      - ./public/assets/uploads:/uploads
    # Creates the folder before the test runner (root) does and gives it to www-data (uid 33), which writes the uploads
    command: sh -c "mkdir -p /uploads/resources && chown -R 33:33 /uploads"

  db:
    image: mysql:8.4.0
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: "$DB_DATABASE"
      MYSQL_USER: "$DB_USERNAME"
      MYSQL_PASSWORD: "$DB_PASSWORD"
      MYSQL_ALLOW_EMPTY_PASSWORD: yes
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app-network

  selenium:
    image: selenium/standalone-chrome-debug:latest
    ports:
      - 4444:4444
      - 5900:5900
    networks:
      - app-network

  php_test:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      - app-network
    depends_on:
      db:
        condition: service_started
      selenium:
        condition: service_started
      uploads-permissions:
        condition: service_completed_successfully
    environment:
      APP_ENV: testing
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: problem_test
      DB_USERNAME: root
      DB_PASSWORD: ""

networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
